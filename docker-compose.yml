# Reproducible Neo4j for the E. coli enrichment project.
#
#   docker compose up -d        # start Neo4j (browser at http://localhost:7474)
#   ./load_graph.sh             # build the graph from csv/
#   pip install -r requirements.txt
#   python app.py -q query/set1.txt -t Pathway -c
#
# Default credentials below are for local use only — override NEO4J_AUTH
# and the password passed to load_graph.sh for anything shared.

services:
  neo4j:
    image: neo4j:5.21-community
    container_name: ecoli-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/testpassword
      # LOAD CSV from the mounted import directory
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ./csv:/var/lib/neo4j/import:ro   # csv/ reachable via file:///
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  neo4j_data:
